name: Deploy to Cloudflare Workers

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # package-lock.json is gitignored in this repo, so `npm ci` is not available.
      - run: npm install --no-audit --no-fund

      - name: Build (cloudflare_module preset)
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_STUDIO_URL: ${{ vars.NUXT_PUBLIC_STUDIO_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
